name: CoudPouss Admin Web CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy CoudPouss Admin Web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            echo "🚀 Connected to CoudPouss Admin Web Server"

            cd /home/projects/coudpouss-admin-web

            echo "📌 Pulling branch: main"
            git fetch origin
            git checkout main
            git pull origin main

            echo "🐳 Building & running CoudPouss Admin Web containers"
            docker compose -f docker-compose.yml up -d --build

            echo "✅ CoudPouss Admin Web CI/CD completed successfully"
